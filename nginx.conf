events {}
http {
    server {
        listen 80;
        listen  [::]:80;
        listen 443 ssl default_server backlog=16384;
        listen [::]:443 ssl default_server backlog=16384;

        ssl_certificate certs/ssl/bundle.crt;
        ssl_certificate_key certs/ssl/private.key;

        if ($scheme = http) {
            return 301 https://$server_name$request_uri;
        }

        # CDN assets (JS SDK and all async modules)
        location /libs/ {
            proxy_ssl_server_name on;
            proxy_set_header Host cdn.mxpnl.com;
            proxy_pass https://cdn.mxpnl.com/libs/;
        }

        # Tracking endpoints → api.mixpanel.com
        location / {
            proxy_set_header Host api.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://api.mixpanel.com/;
        }
    }
}
